name: Windows x64

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-fork:
    name: Verify fork identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify private-fork invariants
        run: python tools/verify_private_fork.py

  build-windows-x64:
    name: Build Windows x64
    needs: verify-fork
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/tg190x4-v')
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
      TG190X4_ENABLE_AUTOUPDATE: "OFF"
      TG190X4_BUILD_PARALLEL: "4"
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reclaim runner disk space
        shell: pwsh
        run: |
          $paths = @(
            'C:\Android',
            'C:\hostedtoolcache\windows\CodeQL'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem

      - name: Build TG 190x4 EDITION
        shell: cmd
        run: call build_tg190x4.bat

      - name: Read version
        shell: pwsh
        run: |
          $line = Get-Content Telegram/build/version |
            Where-Object { $_ -match '^AppVersionStr\s+([^\s]+)$' } |
            Select-Object -First 1
          if (-not $line -or $line -notmatch '^AppVersionStr\s+([^\s]+)$') {
            throw 'AppVersionStr was not found.'
          }
          "TG190X4_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'out\Release\TG190x4.exe'
          if (-not (Test-Path $exe)) { throw 'TG190x4.exe was not produced.' }

          $version = (Get-Item $exe).VersionInfo
          Write-Host "ProductName=$($version.ProductName)"
          Write-Host "FileDescription=$($version.FileDescription)"
          Write-Host "FileVersion=$($version.FileVersion)"
          Write-Host "ProductVersion=$($version.ProductVersion)"

          if ($version.ProductName -ne 'TG 190x4 EDITION') {
            throw "Unexpected ProductName: $($version.ProductName)"
          }
          if ($version.FileDescription -ne 'TG 190x4 EDITION') {
            throw "Unexpected FileDescription: $($version.FileDescription)"
          }
          if (-not $version.FileVersion.StartsWith($env:TG190X4_VERSION)) {
            throw "Unexpected FileVersion: $($version.FileVersion), expected $env:TG190X4_VERSION"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe",
            "${env:LocalAppData}\Programs\Inno Setup 6\ISCC.exe"
          )
          if (-not ($isccCandidates | Where-Object { Test-Path $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\package_windows.ps1" `
            -ReleasePath "$env:GITHUB_WORKSPACE\out\Release" `
            -OutputPath "$env:GITHUB_WORKSPACE\artifacts"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" -File | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TG190x4-Windows-x64-${{ env.TG190X4_VERSION }}
          path: |
            artifacts/TG190x4-portable-x64-*.zip
            artifacts/TG190x4-setup-x64-*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
